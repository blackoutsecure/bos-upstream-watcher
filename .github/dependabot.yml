# Dependabot config for bos-upstream-watcher.
#
# This repo follows the Blackout Secure Marketplace Action dev/main
# split:
#   * `dev`  — workflow files (the hub-managed `bos-universal-*` kickers)
#              live here. Dependabot PRs target THIS branch so CI runs
#              against them.
#   * `main` — curated Marketplace artifact (no workflow files). Receives
#              allowlist promotes from `dev` via the hub release pipeline.
#
# Dependabot reads its config only from the default branch, so this file
# is synced to `main` on every promote and the `target-branch: dev`
# override below is what keeps PRs landing on `dev` (where the CI
# workflows live).
#
# `target-branch:` is rendered by the hub from
# `general.dependabot_target_branch` in `bos-universal-config.json` —
# change it there, not here.

version: 2
updates:

# >>> bos-automation-hub:dependabot_actions >>>
# Managed by https://github.com/blackoutsecure/bos-automation-hub — do not edit between markers.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      docker-actions:
        patterns:
          - "docker/*"
      github-actions:
        patterns:
          - "actions/*"
# <<< bos-automation-hub:dependabot_actions <<<

# >>> bos-automation-hub:dependabot_pip >>>
# Managed by https://github.com/blackoutsecure/bos-automation-hub — do not edit between markers.
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - python
# <<< bos-automation-hub:dependabot_pip <<<
