# Dependabot config for bos-upstream-watcher.
#
# This repo follows the Blackout Secure Marketplace Action dev/main
# split:
#   * `dev`  — workflow files (the hub-managed `bos-universal-*` kickers)
#              live here. Dependabot PRs target THIS branch so CI runs
#              against them.
#   * `main` — curated Marketplace artifact (no workflow files). Receives
#              allowlist promotes from `dev` via the hub release pipeline.
#
# Dependabot reads its config only from the default branch, so this file
# is synced to `main` on every promote and the `target-branch: dev`
# override below is what keeps PRs landing on `dev` (where the CI
# workflows live).
#
# `target-branch:` is part of the managed block content. The GitHub Actions
# ecosystem block is overridden in
# `.github/bos-universal-config.json` under
# `managed_file_sync.service_definitions.dependabot_actions` — change it
# there, not here, or the next sync run will overwrite it.

version: 2
updates:



# >>> managed-file-sync:dependabot_actions >>>
# Managed by Blackout Secure Managed File Sync — configure services in .github/bos-universal-config.json.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "actions/*"
# <<< managed-file-sync:dependabot_actions <<<

# >>> managed-file-sync:dependabot_pip >>>
# Managed by Blackout Secure Managed File Sync — configure services in .github/bos-universal-config.json.
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - python
# <<< managed-file-sync:dependabot_pip <<<
