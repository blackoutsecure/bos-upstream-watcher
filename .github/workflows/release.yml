#
# `workflow_dispatch`-only release pipeline. Promotes the allowlisted
# files from `dev` to `main`, tags `main` at the resulting commit,
# and publishes a GitHub Release (which triggers Marketplace pickup).
#
# Lives on `dev` only — the underlying bos-marketplace-kit `promote`
# composite hard-blocks any path under `.github/workflows/**` in the
# allowlist, and the org-level ruleset on `main` blocks direct pushes.

name: Release (Marketplace promote)

"on":
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (SemVer, e.g. v1.2.0 or v1.2.0-rc.1).'
        required: true
        type: string
      dry_run:
        description: 'Dry run (validate + diff, do not push/tag).'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Publish the GitHub Release as a draft.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: blackoutsecure/bos-automation-hub/.github/workflows/release-promote.yml@main
    permissions:
      contents: write
    with:
      source_branch: 'dev'
      target_branch: 'main'

      # ----- Allowlist -----------------------------------------------------
      # This is a composite Action (`runs: composite`) that invokes
      # `src/discover.py` via `composite-runs-shell`. The `src/` tree
      # IS the runtime — it must be promoted to main alongside
      # `action.yml` and the Marketplace metadata files.
      #
      # `pyproject.toml`, `requirements-dev.txt`, and `test/` are
      # dev-only — they stay on `dev` and are NOT in the allowlist.
      allowlist_paths: |
        action.yml
        src
        README.md
        LICENSE
        NOTICE

      include_dependabot_config: true
      include_github_metadata: true
      extra_sync_paths: ''

      tag_name: ${{ inputs.tag_name }}
      dry_run:  ${{ inputs.dry_run }}

      release_template_path:  ''
      release_extra_context:  |
        REPO=${{ github.repository }}
        TAG=${{ inputs.tag_name }}
      release_draft:          ${{ inputs.draft }}
      release_prerelease:     ''
      release_make_latest:    'true'
      release_generate_notes: true
