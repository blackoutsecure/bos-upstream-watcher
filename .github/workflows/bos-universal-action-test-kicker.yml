# Managed by Blackout Secure Managed File Sync — configure services in .github/bos-universal-config.json.
# Do not edit — every sync run overwrites this file.
# Blackout Secure universal action test kicker (hub-managed).
# Customize via `.github/bos-universal-config.json`, not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: '[KICKER] Blackout Secure Universal Action Test'
run-name: >-
  Blackout Secure / action test / ${{
    github.event_name == 'pull_request'
      && format('PR #{0}', github.event.pull_request.number)
      || github.event_name == 'push'
      && 'push'
      || 'manual'
  }}

"on":
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    paths-ignore:
      - '.github/workflows/bos-universal-action-test-kicker.yml'
      - '**/bos-scan-*.sarif'
      - '**/bos-scan-*.json'
      - '**/blackout-secure-audit-report.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bos-action-test-kicker-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    name: Sync managed kicker and config
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@main
    with:
      mode: commit
    secrets: inherit

  parse_config:
    name: Parse universal config
    needs: sync-check
    if: >-
      needs.sync-check.result == 'success'
      && !contains(needs.sync-check.outputs.changed_files, '.github/workflows/bos-universal-action-test-kicker.yml')
      && !contains(needs.sync-check.outputs.changed_files, '.github/bos-universal-config.json')
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 2
    outputs:
      target_ref: ${{ steps.target_ref.outputs.ref }}
    steps:
      - name: Checkout hub resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}
          path: hub-runtime
          sparse-checkout: .github/actions/shared/resolve-hub-ref
          sparse-checkout-cone-mode: false
      - name: Resolve target hub ref
        id: target_ref
        uses: ./hub-runtime/.github/actions/shared/resolve-hub-ref
        with:
          event_name: ${{ github.event_name }}
          base_ref: ${{ github.base_ref }}
          ref_name: ${{ github.ref_name }}

  action-test-dev:
    name: action-test (dev)
    needs: parse_config
    if: needs.parse_config.outputs.target_ref == 'dev'
    permissions:
      contents: read
      models: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-action-test.yml@dev

  action-test-main:
    name: action-test (main)
    needs: parse_config
    if: needs.parse_config.outputs.target_ref == 'main'
    permissions:
      contents: read
      models: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-action-test.yml@main
