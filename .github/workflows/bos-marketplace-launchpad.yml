# Blackout Secure Marketplace Launchpad caller for a Python composite Action.
#
# Thin (~60-line) event-trigger wrapper around the hub-side reusable
# bos-marketplace-launchpad.yml in blackoutsecure/bos-automation-hub.
#
# All orchestration logic — composing marketplace-action-ci.yml +
# marketplace-repo-guard.yml + release-promote.yml, event routing,
# per-stage permissions — lives in the hub reusable. This file is
# intentionally minimal: subscribe to events, forward context, set
# the one per-repo customization (runtime_artifact_dir).
#
# Per-repo customization: runtime_artifact_dir = 'src'
# (a Python composite Action runtime artifact directory). Auto-appended to both the
# guard's required_paths and the release's allowlist_paths by the
# hub reusable, so a single input drives both protections.
#
# Routing inside the hub reusable:
#
#   pull_request (base = dev)         → ci      stage runs
#   push (branch = dev)               → ci      stage runs (post-merge re-verify)
#   pull_request_target (base = main) → guard   stage runs
#   workflow_dispatch mode=release    → release stage runs
#   workflow_dispatch mode=name-check → ci      stage runs (name-check on)
#
# This file MUST NOT exist on `main` — Marketplace publishing
# requires zero workflow files on the default branch. The hub-side
# release stage's allowlist excludes `.github/workflows/**` by
# design; do not override it.
name: Blackout Secure Marketplace Launchpad

"on":
  pull_request:
    branches: ['dev']
  push:
    branches: ['dev']
  pull_request_target:
    branches: ['main']
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation: `release` (promote dev → main + GH Release) or `name-check` (one-shot Marketplace name availability probe).'
        required: true
        type: choice
        options:
          - release
          - name-check
        default: release
      tag_name:
        description: 'Release tag (SemVer, e.g. v1.2.0). Required when `mode: release`.'
        required: false
        type: string
      dry_run:
        description: 'Dry run — validate + diff, do not push/tag.'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Publish the GitHub Release as a draft.'
        required: false
        type: boolean
        default: false
      enable_security_scan:
        description: 'Run launchpad security_scan stage (CodeQL/repo security scan).'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read
  # The hub reusable declares a nested `security_scan` job that
  # statically requires `security-events: write` + `actions: read`.
  # GitHub validates this cascade at workflow-load time, BEFORE
  # evaluating the job's `if:` gate — so these grants MUST be present
  # whether `enable_security_scan` is on or off,
  # or the workflow fails to load with:
  #   The nested job 'security_scan' is requesting
  #   'actions: read, security-events: write', but is only allowed
  #   'actions: none, security-events: none'.
  security-events: write
  actions: read

concurrency:
  group: >-
    bos-marketplace-launchpad-${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number
      || inputs.tag_name
      || github.ref
    }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  launchpad:
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-marketplace-launchpad.yml@main
    permissions:
      contents: write
      pull-requests: read
      # See workflow-level note above — required statically by the
      # hub reusable's `security_scan` nested job regardless of
      # whether the job runs for this invocation.
      security-events: write
      actions: read
    with:
      # ----- Event-routing context (forwarded from caller event) -----
      event_name:      ${{ github.event_name }}
      dispatched_mode: ${{ inputs.mode || '' }}
      pr_base_sha:     ${{ github.event.pull_request.base.sha || '' }}
      pr_head_sha:     ${{ github.event.pull_request.head.sha || '' }}

      # ----- Per-repo customization (single source of truth) -----
      runtime_artifact_dir: 'src'

      # Enable launchpad security scan by default for this repo.
      # On `workflow_dispatch`, the dispatch input wins (including an
      # explicit `false`). On all other event types, the repo/org var
      # `BOS_ENABLE_SECURITY_SCAN` controls it — defaulting to enabled
      # unless the var is explicitly set to the string `'false'`.
      #
      # NOTE: the two clauses are kept mutually exclusive on
      # `github.event_name` so the `||` short-circuit cannot silently
      # override an explicit dispatch `false` with the var fallback.
      enable_security_scan: ${{ (github.event_name == 'workflow_dispatch' && inputs.enable_security_scan) || (github.event_name != 'workflow_dispatch' && vars.BOS_ENABLE_SECURITY_SCAN != 'false') }}

      # ----- Community-health files inherited from blackoutsecure/.github
      # CONTRIBUTING.md is intentionally absent locally; the org
      # default applies. Without this override the kit `check`
      # composite would fall back to `either` and treat the missing
      # local CONTRIBUTING.md as a warn. SECURITY.md / CODE_OF_CONDUCT.md
      # / SUPPORT.md / issue templates / PR template / FUNDING.yml all
      # live in the org `.github` repo and are inherited the same way.
      community_health_source: 'inherit'

      # ----- Release dispatch inputs (ignored for non-release events) -----
      tag_name:      ${{ inputs.tag_name || '' }}
      dry_run:       ${{ inputs.dry_run || false }}
      release_draft: ${{ inputs.draft || false }}
