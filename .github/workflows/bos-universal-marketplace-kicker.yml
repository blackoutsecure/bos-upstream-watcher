# Blackout Secure universal Marketplace kicker (hub-managed).
# Customize via `.github/bos-universal-config.json`, not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: '[KICKER] Blackout Secure Universal Marketplace'
run-name: >-
  Blackout Secure / marketplace / ${{
    github.event_name == 'pull_request_target'
      && format('guard PR #{0}', github.event.pull_request.number)
      || github.event_name == 'pull_request'
      && format('validate PR #{0}', github.event.pull_request.number)
      || github.event_name == 'push'
      && 'validate push'
      || inputs.operation || 'manual'
  }}

"on":
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    # The relevance-gate/relevance-gate-reset jobs below commit back to
    # this exact file. Without this, that commit is itself a push that
    # re-triggers this workflow, which commits again — an infinite
    # self-triggering loop (confirmed happening in production: dozens
    # of "chore: update marketplace relevance score" commits in a row
    # across every onboarded repo before this fix).
    paths-ignore:
      - '.github/marketplace-relevance-score.json'
      - '.github/workflows/bos-universal-marketplace-kicker.yml'
      - '**/bos-scan-*.sarif'
      - '**/bos-scan-*.json'
      - '**/blackout-secure-audit-report.*'
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      operation:
        description: Marketplace operation.
        required: true
        type: choice
        options: [validate, name-check, promote, release, metadata]
        default: release
      tag_name:
        description: Optional SemVer release tag; empty auto-bumps the latest stable tag.
        required: false
        type: string
        default: ''
      dry_run:
        description: Preview the selected release or metadata operation without publishing or writing.
        required: false
        type: boolean
        default: false
      draft:
        description: Publish the GitHub Release as a draft.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bos-marketplace-kicker-${{ github.repository }}-${{ github.ref }}-${{ inputs.operation || 'validate' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.operation != 'release' }}

jobs:
  sync-check:
    name: Sync managed kicker and config
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@main
    with:
      mode: commit
    secrets: inherit

  parse_config:
    name: Parse universal config
    needs: sync-check
    if: >-
      needs.sync-check.result == 'success'
      && !contains(needs.sync-check.outputs.changed_files, '.github/workflows/bos-universal-marketplace-kicker.yml')
      && !contains(needs.sync-check.outputs.changed_files, '.github/bos-universal-config.json')
    # Resolve runner from org-shared `vars.DEFAULT_RUNNER` when set,
    # supporting both bare label and JSON-array formats. Fallback to
    # `ubuntu-latest` if the variable is not defined in the consumer.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 2
    outputs:
      cfg: ${{ steps.config.outputs.cfg }}
      target_ref: ${{ steps.target_ref.outputs.ref }}
    steps:
      - name: Checkout trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - name: Checkout marketplace-kicker org-wide defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: main
          path: hub-config
          sparse-checkout: sync-files/config/marketplace-kicker-global-config.json
          sparse-checkout-cone-mode: false
      - name: Load universal config
        id: config
        uses: blackoutsecure/bos-automation-hub/.github/actions/universal-config@main
        with:
          config_path: .github/bos-universal-config.json
          allow_missing: 'false'
          require_marketplace_enabled: 'true'
          global_config_path: hub-config/sync-files/config/marketplace-kicker-global-config.json
          use_global_config: auto
      - name: Checkout hub resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}
          path: hub-runtime
          sparse-checkout: .github/actions/resolve-hub-ref
          sparse-checkout-cone-mode: false
      - name: Resolve target hub ref
        id: target_ref
        uses: ./hub-runtime/.github/actions/resolve-hub-ref
        with:
          event_name: ${{ github.event_name }}
          base_ref: ${{ github.base_ref }}
          ref_name: ${{ github.ref_name }}

  validate-dev:
    name: Marketplace validation (dev)
    needs: parse_config
    if: >-
      needs.parse_config.outputs.target_ref == 'dev'
      && (
        github.event_name == 'pull_request'
        || github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.operation != 'release')
      )
    permissions:
      contents: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-marketplace.yml@dev
    with:
      action_yml_path: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.action_yml_path || 'action.yml' }}
      run_branding_preview: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.run_branding_preview != false }}
      run_name_check: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'name-check' }}

  validate-main:
    name: Marketplace validation (main)
    needs: parse_config
    if: >-
      needs.parse_config.outputs.target_ref == 'main'
      && (
        github.event_name == 'pull_request'
        || github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.operation != 'release')
      )
    permissions:
      contents: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-marketplace.yml@main
    with:
      action_yml_path: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.action_yml_path || 'action.yml' }}
      run_branding_preview: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.run_branding_preview != false }}
      run_name_check: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'name-check' }}

  guard:
    name: Marketplace stable-branch guard
    needs: parse_config
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.base.ref
        == (fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.target_branch || 'main')
    permissions:
      contents: read
      pull-requests: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/marketplace-repo-guard.yml@main
    with:
      pr_base_sha: ${{ github.event.pull_request.base.sha }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      check_pr_diff: true
      check_tree_state: true
      require_action_yml: true
      blocked_paths: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.blocked_paths || '.github/workflows/' }}
      required_paths: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.required_paths || '' }}

  # Scores the push's changes for auto-publish significance (see the kit's
  # "Auto-publish relevance gate" README section). Push-only: PRs and manual
  # dispatch never need this, and scoring a PR would score against a base
  # that isn't necessarily what eventually merges. Off by default
  # (`auto_publish.enabled: false`) — the job still runs but the composite
  # reports `should_publish: false` unconditionally when disabled, so this
  # is a no-op until a repo opts in.
  relevance-gate:
    name: Auto-publish relevance gate
    needs: parse_config
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 5
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
      requires_manual_approval: ${{ steps.gate.outputs.requires_manual_approval }}
      approval_environment: ${{ steps.gate.outputs.approval_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          token: ${{ secrets.WORKFLOW_SYNC_PAT || github.token }}
          persist-credentials: true
      - name: Score relevance
        id: gate
        uses: blackoutsecure/bos-marketplace-kit/.github/actions/relevance-gate@c3ca87e5c5c9d72237ce8ff426a759b0f878de91 # v0.1.28
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN || github.token }}
      - name: Checkout hub commit-and-push helper
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: ${{ needs.parse_config.outputs.target_ref }}
          path: hub-runtime
          sparse-checkout: .github/actions/commit-and-push
          sparse-checkout-cone-mode: false
      - name: Persist the running score
        if: always()
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          state_path="$(git status --porcelain -- '.github/marketplace-relevance-score.json' | awk '{print $2}')"
          echo "changed_files=${state_path}" >> "${GITHUB_OUTPUT}"
      - uses: ./hub-runtime/.github/actions/commit-and-push
        if: always() && steps.persist.outputs.changed_files != ''
        with:
          files: ${{ steps.persist.outputs.changed_files }}
          message: 'chore: update marketplace relevance score'

  # A job calling a reusable workflow via `uses:` cannot also declare
  # `environment:` (unsupported combination — GitHub rejects the whole
  # workflow file at parse time, before any job runs). This job holds
  # the environment gate instead; `release` below only requires it to
  # have succeeded when manual approval is actually required.
  manual-approval-gate:
    name: Manual approval gate
    needs: [parse_config, relevance-gate]
    if: >-
      github.event_name == 'push'
      && needs.relevance-gate.result == 'success'
      && needs.relevance-gate.outputs.should_publish == 'true'
      && needs.relevance-gate.outputs.requires_manual_approval == 'true'
    environment: ${{ needs.relevance-gate.outputs.approval_environment }}
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 5
    steps:
      - run: echo "Approved for auto-publish release."

  release:
    name: Marketplace release
    needs: [parse_config, relevance-gate, manual-approval-gate]
    if: >-
      always()
      && needs.parse_config.result == 'success'
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.operation == 'release' || inputs.operation == 'promote'))
        || (
          github.event_name == 'push'
          && needs.relevance-gate.result == 'success'
          && needs.relevance-gate.outputs.should_publish == 'true'
          && (
            needs.relevance-gate.outputs.requires_manual_approval != 'true'
            || needs.manual-approval-gate.result == 'success'
          )
        )
      )
    permissions:
      contents: write
      models: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/release-promote.yml@main
    with:
      source_branch: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.source_branch || github.event.repository.default_branch }}
      target_branch: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.target_branch || 'main' }}
      allowlist_paths: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.allowlist_paths }}
      include_dependabot_config: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.include_dependabot_config != false }}
      include_github_metadata: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.include_github_metadata == true }}
      extra_sync_paths: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.extra_sync_paths || '' }}
      tag_name: ${{ inputs.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}
      release_draft: ${{ inputs.draft || false }}
      publish_release: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'release' }}
      require_source_release: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'promote' && fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.require_source_release != false }}
      source_release_max_age_hours: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.source_release_max_age_hours || 168 }}
      # release_label (none/prerelease/latest, default auto) resolves the
      # GitHub Release's flags. "auto" reads the source branch: dev is
      # pre-release, main is the latest production release, anything else
      # is neither. Cascade: repo .github/bos-universal-config.json >
      # sync-files/config/marketplace-kicker-global-config.json > "auto".
      release_prerelease: >-
        ${{
          (fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.release_label || 'auto') == 'prerelease'
          || (
            (fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.release_label || 'auto') == 'auto'
            && (fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.source_branch || github.event.repository.default_branch) == 'dev'
          )
        }}
      release_make_latest: >-
        ${{
          (
            (fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.release_label || 'auto') == 'latest'
            || (
              (fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.release_label || 'auto') == 'auto'
              && (fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.source_branch || github.event.repository.default_branch) == 'main'
            )
          ) && 'true' || 'false'
        }}
      release_generate_notes: true
    secrets: inherit

  # Zeroes the running score once an auto-triggered release actually
  # succeeds. A manual `workflow_dispatch` release does not touch the
  # score — it's an explicit operator action, independent of the gate.
  relevance-gate-reset:
    name: Reset relevance score after auto-publish
    needs: [parse_config, relevance-gate, release]
    if: >-
      github.event_name == 'push'
      && needs.relevance-gate.result == 'success'
      && needs.relevance-gate.outputs.should_publish == 'true'
      && needs.release.result == 'success'
    permissions:
      contents: write
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.WORKFLOW_SYNC_PAT || github.token }}
          persist-credentials: true
      - uses: blackoutsecure/bos-marketplace-kit/.github/actions/relevance-gate@c3ca87e5c5c9d72237ce8ff426a759b0f878de91 # v0.1.28
        with:
          reset: 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: ${{ needs.parse_config.outputs.target_ref }}
          path: hub-runtime
          sparse-checkout: .github/actions/commit-and-push
          sparse-checkout-cone-mode: false
      - uses: ./hub-runtime/.github/actions/commit-and-push
        with:
          files: .github/marketplace-relevance-score.json
          message: 'chore: reset marketplace relevance score after auto-publish'

  metadata-dev:
    name: Marketplace repository metadata (dev)
    needs: [parse_config, release]
    if: >-
      always()
      && needs.parse_config.result == 'success'
      && needs.parse_config.outputs.target_ref == 'dev'
      && fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.enable == true
      && (
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'metadata')
        || (
          github.event_name == 'workflow_dispatch'
          && inputs.operation == 'release'
          && needs.release.result == 'success'
          && !inputs.dry_run
          && !inputs.draft
        )
        || (
          github.event_name == 'push'
          && needs.release.result == 'success'
        )
      )
    permissions:
      contents: read
      models: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/repo-metadata-sync.yml@dev
    with:
      checkout_ref: ${{ needs.release.result == 'success' && needs.release.outputs.tag_name || (fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.target_branch || 'main') }}
      description: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.description || '' }}
      description_mode: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.description_mode || 'auto' }}
      description_fallback: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.description_fallback || '' }}
      homepage: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.homepage || '' }}
      topics: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.topics || '' }}
      generate_topics: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.generate_topics == true }}
      topics_fallback: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.topics_fallback || '' }}
      primary_category: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.categories.primary || 'auto' }}
      secondary_category: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.categories.secondary || 'auto' }}
      marketplace_slug: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.marketplace_slug || '' }}
      ai_enabled: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.ai_enabled != false }}
      ai_model: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.ai_model || 'auto' }}
      show_releases: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.show_releases != false }}
      show_deployments: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.show_deployments == true }}
      show_packages: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.show_packages == true }}
      dry_run: ${{ inputs.dry_run || fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.dry_run == true }}
    secrets: inherit

  metadata-main:
    name: Marketplace repository metadata (main)
    needs: [parse_config, release]
    if: >-
      always()
      && needs.parse_config.result == 'success'
      && needs.parse_config.outputs.target_ref == 'main'
      && fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.enable == true
      && (
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'metadata')
        || (
          github.event_name == 'workflow_dispatch'
          && inputs.operation == 'release'
          && needs.release.result == 'success'
          && !inputs.dry_run
          && !inputs.draft
        )
        || (
          github.event_name == 'push'
          && needs.release.result == 'success'
        )
      )
    permissions:
      contents: read
      models: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/repo-metadata-sync.yml@main
    with:
      checkout_ref: ${{ needs.release.result == 'success' && needs.release.outputs.tag_name || (fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.target_branch || 'main') }}
      description: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.description || '' }}
      description_mode: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.description_mode || 'auto' }}
      description_fallback: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.description_fallback || '' }}
      homepage: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.homepage || '' }}
      topics: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.topics || '' }}
      generate_topics: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.generate_topics == true }}
      topics_fallback: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.topics_fallback || '' }}
      primary_category: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.categories.primary || 'auto' }}
      secondary_category: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.categories.secondary || 'auto' }}
      marketplace_slug: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.marketplace_slug || '' }}
      ai_enabled: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.ai_enabled != false }}
      ai_model: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.ai_model || 'auto' }}
      show_releases: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.show_releases != false }}
      show_deployments: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.show_deployments == true }}
      show_packages: ${{ fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.show_packages == true }}
      dry_run: ${{ inputs.dry_run || fromJson(needs.parse_config.outputs.cfg || '{}').marketplace.repo_metadata.dry_run == true }}
    secrets: inherit
