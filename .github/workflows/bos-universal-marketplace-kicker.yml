# Managed by Blackout Secure Managed File Sync — configure services in .github/bos-universal-config.json.
# Do not edit — every sync run overwrites this file.
# Blackout Secure universal Marketplace kicker (hub-managed).
# Customize via `.github/bos-universal-config.json`, not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: Blackout Secure Universal Marketplace
run-name: >-
  Blackout Secure / marketplace / ${{
    github.event_name == 'pull_request_target'
      && format('guard PR #{0}', github.event.pull_request.number)
      || github.event_name == 'pull_request'
      && format('validate PR #{0}', github.event.pull_request.number)
      || github.event_name == 'push'
      && 'validate push'
      || inputs.operation || 'manual'
  }}

"on":
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      operation:
        description: Marketplace operation.
        required: true
        type: choice
        options: [validate, name-check, release, metadata]
        default: release
      tag_name:
        description: Optional SemVer release tag; empty auto-bumps the latest stable tag.
        required: false
        type: string
        default: ''
      dry_run:
        description: Preview the selected release or metadata operation without publishing or writing.
        required: false
        type: boolean
        default: false
      draft:
        description: Publish the GitHub Release as a draft.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.operation || 'validate' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.operation != 'release' }}

jobs:
  parse_config:
    name: Parse universal config
    # Resolve runner from org-shared `vars.DEFAULT_RUNNER` when set,
    # supporting both bare label and JSON-array formats. Fallback to
    # `ubuntu-latest` if the variable is not defined in the consumer.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 2
    outputs:
      cfg: ${{ steps.config.outputs.cfg }}
      target_ref: ${{ steps.target_ref.outputs.ref }}
    steps:
      - name: Checkout trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - name: Load universal config
        id: config
        uses: blackoutsecure/bos-automation-hub/.github/actions/shared/universal-config@main
        with:
          config_path: .github/bos-universal-config.json
          allow_missing: 'false'
          require_marketplace_enabled: 'true'
      - name: Checkout hub resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}
          path: hub-runtime
          sparse-checkout: .github/actions/shared/resolve-hub-ref
          sparse-checkout-cone-mode: false
      - name: Resolve target hub ref
        id: target_ref
        uses: ./hub-runtime/.github/actions/shared/resolve-hub-ref
        with:
          event_name: ${{ github.event_name }}
          base_ref: ${{ github.base_ref }}
          ref_name: ${{ github.ref_name }}

  validate-dev:
    name: Marketplace validation (dev)
    needs: parse_config
    if: >-
      needs.parse_config.outputs.target_ref == 'dev'
      && (
        github.event_name == 'pull_request'
        || github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.operation != 'release')
      )
    permissions:
      contents: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-marketplace.yml@dev
    with:
      action_yml_path: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.action_yml_path || 'action.yml' }}
      run_branding_preview: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.run_branding_preview != false }}
      run_name_check: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'name-check' }}

  validate-main:
    name: Marketplace validation (main)
    needs: parse_config
    if: >-
      needs.parse_config.outputs.target_ref == 'main'
      && (
        github.event_name == 'pull_request'
        || github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.operation != 'release')
      )
    permissions:
      contents: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-marketplace.yml@main
    with:
      action_yml_path: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.action_yml_path || 'action.yml' }}
      run_branding_preview: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.run_branding_preview != false }}
      run_name_check: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'name-check' }}

  guard:
    name: Marketplace stable-branch guard
    needs: parse_config
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.base.ref
        == (fromJson(needs.parse_config.outputs.cfg).marketplace.target_branch || 'main')
    permissions:
      contents: read
      pull-requests: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/marketplace-repo-guard.yml@main
    with:
      pr_base_sha: ${{ github.event.pull_request.base.sha }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      check_pr_diff: true
      check_tree_state: true
      require_action_yml: true
      blocked_paths: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.blocked_paths || '.github/workflows/' }}
      required_paths: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.required_paths || '' }}

  release:
    name: Marketplace release
    needs: parse_config
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'release' }}
    permissions:
      contents: write
      models: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/release-promote.yml@main
    with:
      source_branch: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.source_branch || github.event.repository.default_branch }}
      target_branch: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.target_branch || 'main' }}
      allowlist_paths: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.allowlist_paths }}
      include_dependabot_config: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.include_dependabot_config != false }}
      include_github_metadata: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.include_github_metadata == true }}
      extra_sync_paths: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.extra_sync_paths || '' }}
      tag_name: ${{ inputs.tag_name }}
      dry_run: ${{ inputs.dry_run }}
      release_draft: ${{ inputs.draft }}
      release_make_latest: 'true'
      release_generate_notes: true
    secrets: inherit

  metadata:
    name: Marketplace repository metadata
    needs: [parse_config, release]
    if: >-
      always()
      && needs.parse_config.result == 'success'
      && fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.enable == true
      && (
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'metadata')
        || (
          github.event_name == 'workflow_dispatch'
          && inputs.operation == 'release'
          && needs.release.result == 'success'
          && !inputs.dry_run
          && !inputs.draft
        )
      )
    permissions:
      contents: read
      models: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/repo-metadata-sync.yml@main
    with:
      checkout_ref: ${{ inputs.operation == 'release' && needs.release.outputs.tag_name || (fromJson(needs.parse_config.outputs.cfg).marketplace.target_branch || 'main') }}
      description: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.description || '' }}
      homepage: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.homepage || '' }}
      topics: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.topics || '' }}
      generate_topics: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.generate_topics == true }}
      topics_fallback: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.topics_fallback || '' }}
      ai_enabled: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.ai_enabled != false }}
      ai_model: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.ai_model || 'openai/gpt-4o-mini' }}
      show_releases: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.show_releases != false }}
      show_deployments: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.show_deployments == true }}
      show_packages: ${{ fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.show_packages == true }}
      dry_run: ${{ inputs.dry_run || fromJson(needs.parse_config.outputs.cfg).marketplace.repo_metadata.dry_run == true }}
    secrets: inherit
