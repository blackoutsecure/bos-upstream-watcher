  release-main:
    name: Release (main)
    needs: parse-config
    if: >-
      needs.parse-config.outputs.target_ref == 'main'
      && contains(fromJson('["full","release_only","security_only"]'), needs.parse-config.outputs.operation)
    permissions:
      contents:        write   # monitor tracking-file commit + GitHub Release publish
      actions:         write   # nested monitor (`gh workflow run`)
