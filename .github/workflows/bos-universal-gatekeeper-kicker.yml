      cloudflare_working_directory: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.working_directory || '' }}
      cloudflare_branch: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.branch || '' }}
      cloudflare_commit_message: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.commit_message || '' }}
      cloudflare_wrangler_version: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.wrangler_version || '' }}
      cloudflare_extra_wrangler_args: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.extra_wrangler_args || '' }}
      cloudflare_ai_bindings: ${{ toJson(fromJson(needs.parse-config.outputs.cfg).cloudflare.ai_bindings || fromJson('[]')) }}
      cloudflare_deploy_artifact_name: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.deploy_artifact_name || '' }}
      cloudflare_deploy: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.deploy || '' }}
      cloudflare_runs_on: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.runs_on || '' }}
      cloudflare_checkout_fetch_depth: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.checkout_fetch_depth || 0 }}
      cloudflare_purge_cache: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.purge_cache != false }}

      # ----- Cloudflare generators -----
      cloudflare_generate_sitemap: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_sitemap == true }}
      cloudflare_generate_robots: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_robots == true }}
      cloudflare_generate_security_txt: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_security_txt == true }}
      cloudflare_generate_humans_txt: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_humans_txt == true }}
      cloudflare_security_contact: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.security_contact || '' }}
      cloudflare_generator_audit: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generator_audit == true }}
      cloudflare_generator_audit_fail_on: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generator_audit_fail_on || 'never' }}
      cloudflare_generator_audit_artifact_name: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generator_audit_artifact_name || 'site-compliance-reports' }}
      cloudflare_generate_manifest: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_manifest == true }}
      cloudflare_manifest_name: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_name || '' }}
      cloudflare_manifest_short_name: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_short_name || '' }}
      cloudflare_manifest_description: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_description || '' }}
      cloudflare_manifest_orientation: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_orientation || '' }}
      cloudflare_manifest_theme_color: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_theme_color || '' }}
      cloudflare_manifest_background_color: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_background_color || '' }}
      cloudflare_manifest_lang: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_lang || '' }}
      cloudflare_manifest_dir: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_dir || '' }}
      cloudflare_manifest_categories: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_categories || '' }}
      cloudflare_manifest_icons_dir: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_icons_dir || '' }}
      cloudflare_generate_redirects: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_redirects == true }}
      cloudflare_redirects_custom_rules: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.redirects_custom_rules || '' }}
      cloudflare_redirects_replace_existing: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.redirects_replace_existing == true }}
      # ----- Cloudflare headers generator -----
      cloudflare_generate_headers: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_headers == true }}
      cloudflare_headers_presets: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_presets || 'security,cache' }}
      cloudflare_headers_csp: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_csp || '' }}
      cloudflare_headers_hsts_max_age: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_hsts_max_age || '63072000' }}
      cloudflare_headers_permissions_policy: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_permissions_policy || 'accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()' }}
      cloudflare_headers_cache_html_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_cache_html_control || 'public, max-age=0, must-revalidate' }}
      cloudflare_headers_cache_assets_pattern: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_cache_assets_pattern || '/assets/*' }}
      cloudflare_headers_cache_assets_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_cache_assets_control || 'public, max-age=31536000, immutable' }}
      cloudflare_generate_common_content_headers: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_common_content_headers != false }}
      cloudflare_common_security_txt_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_security_txt_cache_control || 'public, max-age=86400' }}
      cloudflare_common_robots_txt_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_robots_txt_cache_control || 'public, max-age=86400' }}
      cloudflare_common_sitemap_xml_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_sitemap_xml_cache_control || 'public, max-age=86400' }}
      cloudflare_common_humans_txt_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_humans_txt_cache_control || 'public, max-age=86400' }}
      cloudflare_headers_custom_rules: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_custom_rules || '' }}
      cloudflare_headers_replace_existing: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_replace_existing == true }}
      # ----- GitHub Release stage -----
      release_template_path: ${{ fromJson(needs.parse-config.outputs.cfg).release.template_path || '' }}
      release_extra_context: ${{ fromJson(needs.parse-config.outputs.cfg).release.extra_context || '' }}
      generate_release_notes: ${{ fromJson(needs.parse-config.outputs.cfg).release.generate_notes != false }}
      release_files: ${{ fromJson(needs.parse-config.outputs.cfg).release.files || '' }}
      release_draft: ${{ fromJson(needs.parse-config.outputs.cfg).release.draft == true }}

      # ----- Shared -----
      platforms: ${{ fromJson(needs.parse-config.outputs.cfg).platforms || 'linux/amd64,linux/arm64' }}

      # ----- Universal kicker wiring -----
      use_launchpad_config: true

      # ----- Optional stages configured from data file -----
      enable_security_scan: ${{ needs.parse-config.outputs.run_security == 'true' || fromJson(needs.parse-config.outputs.cfg).security_scan.enable == true }}
      security_scan_fail_on: ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.fail_on || 'fail' }}
      security_scan_blocks_release: ${{ toJSON(fromJson(needs.parse-config.outputs.cfg).security_scan.blocks_release) != 'false' }}
      security_scan_enable_kit_composite: ${{ toJSON(fromJson(needs.parse-config.outputs.cfg).security_scan.enable_kit_composite) != 'false' }}
      security_scan_enable_posture: ${{ toJSON(fromJson(needs.parse-config.outputs.cfg).security_scan.enable_posture) != 'false' }}
      security_scan_enable_scanners: ${{ toJSON(fromJson(needs.parse-config.outputs.cfg).security_scan.enable_scanners) != 'false' }}
      security_scan_enable_upload: ${{ toJSON(fromJson(needs.parse-config.outputs.cfg).security_scan.enable_upload) != 'false' }}
      security_scan_codeql_languages: ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_languages || '' }}
      security_scan_codeql_queries: ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_queries || 'security-and-quality' }}
      security_scan_codeql_runs_on: ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_runs_on || '' }}
      security_scan_use_advanced_pat: ${{ toJSON(fromJson(needs.parse-config.outputs.cfg).security_scan.use_advanced_pat) != 'false' }}

      enable_repo_metadata: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.enable == true }}
      repo_metadata_description: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.description || '' }}
      repo_metadata_homepage: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.homepage || '' }}
      repo_metadata_topics: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.topics || '' }}
      repo_metadata_generate_topics: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.generate_topics == true }}
      repo_metadata_topics_fallback: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.topics_fallback || '' }}
      repo_metadata_ai_enabled: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.ai_enabled != false }}
      repo_metadata_ai_model: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.ai_model || 'auto' }}
      repo_metadata_show_releases: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_releases != false }}
      repo_metadata_show_deployments: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_deployments == true }}
      repo_metadata_show_packages: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_packages == true }}
      repo_metadata_dry_run: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.dry_run == true }}
    secrets: inherit

  route-verdict:
    name: Dispatch route verdict
    needs:
      - parse-config
      - sync-check-dev
      - sync-check-main
      - action-test
      - metadata
      - marketplace-validate
      - marketplace-release
      - release-dev
      - release-main
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify selected route executed
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_REF: ${{ github.ref_name }}
          PARSE_RESULT: ${{ needs.parse-config.result }}
          SYNC_DEV_RESULT: ${{ needs.sync-check-dev.result }}
          SYNC_MAIN_RESULT: ${{ needs.sync-check-main.result }}
          SYNC_DEV_CHANGED: ${{ needs.sync-check-dev.outputs.changed_files }}
          SYNC_MAIN_CHANGED: ${{ needs.sync-check-main.outputs.changed_files }}
          ACTION_TEST_RESULT: ${{ needs.action-test.result }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          MARKETPLACE_VALIDATE_RESULT: ${{ needs.marketplace-validate.result }}
          MARKETPLACE_RELEASE_RESULT: ${{ needs.marketplace-release.result }}
          RELEASE_DEV_RESULT: ${{ needs.release-dev.result }}
          RELEASE_MAIN_RESULT: ${{ needs.release-main.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${OPERATION}" = "sync_only" ]; then
            if [ "${SYNC_DEV_RESULT}" = "success" ] || [ "${SYNC_MAIN_RESULT}" = "success" ]; then
              echo "::notice title=Dispatch route complete::Managed sync executed successfully."
              exit 0
            fi
            echo "::error::Managed sync did not execute successfully."
            exit 1
          fi
          if [ "${PARSE_RESULT}" != "success" ]; then
            changed="${SYNC_DEV_CHANGED}"$'\n'"${SYNC_MAIN_CHANGED}"
            if [ "${PARSE_RESULT}" = "skipped" ] && { grep -qF '.github/workflows/bos-universal-gatekeeper-kicker.yml' <<< "${changed}" || grep -qF '.github/bos-universal-config.json' <<< "${changed}"; }; then
              echo "::notice title=Dispatch route deferred::Managed routing inputs changed; the fresh commit must start a new run."
              exit 0
            fi
            echo "::error::Config parsing did not succeed and no controlling managed-file change explains the skip."
            exit 1
          fi
          case "${OPERATION}" in
            full|release_only|security_only)
              expected="${RELEASE_MAIN_RESULT}"
              [ "${TARGET_REF}" = "dev" ] && expected="${RELEASE_DEV_RESULT}"
              ;;
            action_test) expected="${ACTION_TEST_RESULT}" ;;
            metadata) expected="${METADATA_RESULT}" ;;
            marketplace_validate) expected="${MARKETPLACE_VALIDATE_RESULT}" ;;
            marketplace_release) expected="${MARKETPLACE_RELEASE_RESULT}" ;;
            *) echo "::error::Unknown operation '${OPERATION}'."; exit 1 ;;
          esac
          if [ "${expected}" = "skipped" ]; then
            echo "::error title=Dispatch route skipped::Operation '${OPERATION}' did not execute its owning job."
            exit 1
          fi
          [ "${expected}" = "success" ] || { echo "::error::Selected route completed with '${expected}'."; exit 1; }
          echo "::notice title=Dispatch route complete::Operation '${OPERATION}' executed successfully."
