#
# Fails any PR into `main` that would add `.github/workflows/**`
# (Marketplace publishing prerequisite) or remove a required runtime
# artifact (action.yml, src, README, LICENSE, NOTICE, dependabot config).

name: Marketplace guard

"on":
  pull_request_target:
    branches: ['main']
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: marketplace-guard-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    uses: blackoutsecure/bos-automation-hub/.github/workflows/marketplace-repo-guard.yml@main
    with:
      pr_base_sha:        ${{ github.event.pull_request.base.sha }}
      pr_head_sha:        ${{ github.event.pull_request.head.sha }}
      check_pr_diff:      true
      check_tree_state:   true
      require_action_yml: true
      blocked_paths: |
        .github/workflows/
        .editorconfig
        .gitattributes
        .gitignore
        .markdownlint.yaml
        pyproject.toml
        requirements-dev.txt
        test/
      required_paths: |
        .github/dependabot.yml
        action.yml
        src
        LICENSE
        NOTICE
        README.md
