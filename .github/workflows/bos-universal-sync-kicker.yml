# Blackout Secure managed file sync kicker (hub-managed).
# Customize via `.github/bos-universal-config.json`, not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: '[KICKER] Blackout Secure Managed File Sync'
run-name: >-
  Blackout Secure managed file sync / ${{
    github.event_name == 'workflow_dispatch'
      && format('manual ({0})', inputs.mode)
      || github.event_name == 'schedule'
      && 'scheduled'
      || 'config changed'
  }}

"on":
  schedule:
    - cron: '29 14 * * 1'
  push:
    paths:
      - '.github/bos-universal-config.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: commit drift back, or check-only'
        type: choice
        options: [commit, check]
        default: commit

permissions:
  contents: read

concurrency:
  group: bos-sync-kicker-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parse_config:
    name: Resolve target hub ref
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 2
    outputs:
      target_ref: ${{ steps.target_ref.outputs.ref }}
    steps:
      - name: Checkout hub resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}
          path: hub-runtime
          sparse-checkout: .github/actions/resolve-hub-ref
          sparse-checkout-cone-mode: false
      - name: Resolve target hub ref
        id: target_ref
        uses: ./hub-runtime/.github/actions/resolve-hub-ref
        with:
          event_name: ${{ github.event_name }}
          ref_name: ${{ github.ref_name }}

  sync-dev:
    name: Sync managed files (dev)
    needs: parse_config
    if: >-
      !cancelled()
      && needs.parse_config.outputs.target_ref == 'dev'
      && (
        github.event_name != 'push'
        || github.ref_name == github.event.repository.default_branch
      )
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@dev
    with:
      mode: ${{ inputs.mode || '' }}
    secrets: inherit

  sync-main:
    name: Sync managed files (main)
    needs: parse_config
    if: >-
      !cancelled()
      && needs.parse_config.outputs.target_ref == 'main'
      && (
        github.event_name != 'push'
        || github.ref_name == github.event.repository.default_branch
      )
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@main
    with:
      mode: ${{ inputs.mode || '' }}
    secrets: inherit
