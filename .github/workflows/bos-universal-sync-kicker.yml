# Managed by https://github.com/blackoutsecure/bos-automation-hub —
# do not edit. To modify, update the `bos_universal_sync` service in
# .github/actions/sync-managed-files/sync.py.
#
# Blackout Secure universal sync kicker (hub-managed).
# Customize via `bos-universal-config.json` (repo root), not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: Blackout Secure universal sync (kicker)
run-name: >-
  Blackout Secure universal sync / ${{
    github.event_name == 'workflow_dispatch'
      && format('manual ({0})', inputs.mode)
      || github.event_name == 'schedule'
      && 'scheduled'
      || 'config changed'
  }}

"on":
  schedule:
    - cron: '29 14 * * 1'
  push:
    paths:
      - 'bos-universal-config.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: commit drift back, or check-only'
        type: choice
        options: [commit, check]
        default: commit

permissions:
  contents: read

jobs:
  resolve-target:
    name: Resolve target hub ref
    # Resolve runner from org-shared `vars.DEFAULT_RUNNER` when set,
    # supporting both bare label and JSON-array formats. Fallback to
    # `ubuntu-latest` if the variable is not defined in the consumer.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 1
    if: >-
      !cancelled()
      && (
        github.event_name != 'push'
        || github.ref_name == github.event.repository.default_branch
      )
    outputs:
      ref: ${{ steps.target-ref.outputs.ref }}
    steps:
      # `uses:` refs cannot be dynamic, so resolve which hub branch this
      # run targets here and pick the matching static-ref job below.
      - name: Resolve target hub ref
        id: target-ref
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="main"
          [ "${REF_NAME}" = "dev" ] && ref="dev"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

  sync-dev:
    name: Sync managed files (dev)
    needs: resolve-target
    if: needs.resolve-target.outputs.ref == 'dev'
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@dev
    with:
      mode: ${{ inputs.mode || '' }}

  sync-main:
    name: Sync managed files (main)
    needs: resolve-target
    if: needs.resolve-target.outputs.ref == 'main'
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@main
    with:
      mode: ${{ inputs.mode || '' }}