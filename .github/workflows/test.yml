name: Test

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  smoke:
    name: smoke (live npm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: discover
        uses: ./
        with:
          source: npm
          package_name: '@actions/core'
          tracker_path: ''

      - name: Print resolved version
        run: |
          echo "version=${{ steps.discover.outputs.version }}"
          echo "tag=${{ steps.discover.outputs.tag }}"
          echo "source_url=${{ steps.discover.outputs.source_url }}"
          echo "changed=${{ steps.discover.outputs.changed }}"
