# Blackout Secure universal security and policy kicker (hub-managed).
# Customize via `.github/bos-universal-config.json`, not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: '[KICKER] Blackout Secure Universal Security'
run-name: >-
  Blackout Secure / security / ${{
    github.event_name == 'pull_request'
      && format('PR #{0}', github.event.pull_request.number)
      || github.event_name == 'merge_group'
      && 'merge queue'
      || github.event_name == 'schedule'
      && 'scheduled'
      || 'manual'
  }}

"on":
  schedule:
    - cron: '43 14 * * *'
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    paths-ignore:
      - '.github/workflows/bos-universal-security-kicker.yml'
      - '**/bos-scan-*.sarif'
      - '**/bos-scan-*.json'
      - '**/blackout-secure-audit-report.*'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bos-security-kicker-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    name: Sync managed kicker and config
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@main
    with:
      mode: commit
    secrets: inherit

  parse_config:
    name: Parse universal config
    needs: sync-check
    if: >-
      needs.sync-check.result == 'success'
      && !contains(needs.sync-check.outputs.changed_files, '.github/workflows/bos-universal-security-kicker.yml')
      && !contains(needs.sync-check.outputs.changed_files, '.github/bos-universal-config.json')
    # Resolve runner from org-shared `vars.DEFAULT_RUNNER` when set,
    # supporting both bare label and JSON-array formats. Fallback to
    # `ubuntu-latest` if the variable is not defined in the consumer.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 2
    outputs:
      target_ref: ${{ steps.target_ref.outputs.ref }}
    steps:
      - name: Checkout hub resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}
          path: hub-runtime
          sparse-checkout: .github/actions/resolve-hub-ref
          sparse-checkout-cone-mode: false
      - name: Resolve target hub ref
        id: target_ref
        uses: ./hub-runtime/.github/actions/resolve-hub-ref
        with:
          event_name: ${{ github.event_name }}
          base_ref: ${{ github.base_ref }}
          merge_group_base_ref: ${{ github.event.merge_group.base_ref }}
          ref_name: ${{ github.ref_name }}

  security-dev:
    name: security (dev)
    needs: parse_config
    if: needs.parse_config.outputs.target_ref == 'dev'
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-security.yml@dev
    with:
      config_authoritative: true
    secrets: inherit

  security-main:
    name: security (main)
    needs: parse_config
    if: needs.parse_config.outputs.target_ref == 'main'
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-security.yml@main
    with:
      config_authoritative: true
    secrets: inherit
