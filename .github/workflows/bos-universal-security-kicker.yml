# Blackout Secure universal security and policy kicker.
# Uses the updated runtime on dev while main remains on the promoted API.
name: Blackout Secure Universal Security
run-name: >-
  Blackout Secure / security / ${{
    github.event_name == 'pull_request'
      && format('PR #{0}', github.event.pull_request.number)
      || github.event_name == 'merge_group'
      && 'merge queue'
      || 'manual'
  }}

"on":
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-config-dev:
    name: Parse launchpad config (dev runtime)
    if: >-
      github.base_ref == 'dev'
      || startsWith(github.ref, 'refs/heads/gh-readonly-queue/dev/')
      || (github.event_name == 'workflow_dispatch' && github.ref_name == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cfg: ${{ steps.config.outputs.cfg }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load launchpad config
        id: config
        uses: blackoutsecure/bos-automation-hub/.github/actions/shared/launchpad-config@dev
        with:
          allow_missing: 'true'

  security-dev:
    name: security
    needs: parse-config-dev
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-gate.yml@dev
    with:
      enable_lint:                 ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.enable_lint != false }}
      enable_node_lint:            ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.enable_node_lint == true }}
      node_version:                ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.node_version || '20' }}
      enable_python_lint:          ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.enable_python_lint == true }}
      python_version:              ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.python_version || '3.11' }}
      enable_shell_lint:           ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.enable_shell_lint == true }}
      enable_dependency_review:    ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.enable_dependency_review != false }}
      enable_code_scan:            ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.enable_code_scan != false }}
      enable_pinned_actions_check: ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.enable_pinned_actions_check != false }}
      enable_pr_title_check:       ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.enable_pr_title_check != false }}
      pr_title_types:              ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.pr_title_types || 'feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert' }}
      enable_readme_header_check:  ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.enable_readme_header_check != false }}
      readme_header_profile:       ${{ fromJson(needs.parse-config-dev.outputs.cfg).gate.readme_header_profile || 'auto' }}
    secrets:
      scanning_pat: ${{ secrets.SCANNING_PAT }}

  parse-config-main:
    name: Parse launchpad config (main runtime)
    if: >-
      github.base_ref == 'main'
      || startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
      || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cfg: ${{ steps.config.outputs.cfg }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load launchpad config
        id: config
        uses: blackoutsecure/bos-automation-hub/.github/actions/shared/launchpad-config@main
        with:
          allow_missing: 'true'

  security-main:
    name: security
    needs: parse-config-main
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-gate.yml@main
    with:
      enable_lint:                 ${{ fromJson(needs.parse-config-main.outputs.cfg).gate.enable_lint != false }}
      enable_dependency_review:    ${{ fromJson(needs.parse-config-main.outputs.cfg).gate.enable_dependency_review != false }}
      enable_code_scan:            ${{ fromJson(needs.parse-config-main.outputs.cfg).gate.enable_code_scan != false }}
      enable_pinned_actions_check: ${{ fromJson(needs.parse-config-main.outputs.cfg).gate.enable_pinned_actions_check != false }}
      enable_pr_title_check:       ${{ fromJson(needs.parse-config-main.outputs.cfg).gate.enable_pr_title_check != false }}
      pr_title_types:              ${{ fromJson(needs.parse-config-main.outputs.cfg).gate.pr_title_types || 'feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert' }}
      enable_readme_header_check:  ${{ fromJson(needs.parse-config-main.outputs.cfg).gate.enable_readme_header_check != false }}
      readme_header_profile:       ${{ fromJson(needs.parse-config-main.outputs.cfg).gate.readme_header_profile || 'auto' }}
    secrets:
      scanning_pat: ${{ secrets.SCANNING_PAT }}
