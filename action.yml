name: 'Blackout Secure Upstream Watcher'
description: >-
  Detect upstream version changes from GitHub Releases, branch HEAD,
  tags, npm, PyPI, container registries, or any URL.
author: 'Blackout Secure'

branding:
  color: 'blue'
  icon: 'compass'

inputs:
  source:
    description: >-
      Provider. One of:
        github_release       — repos/{repo}/releases/latest
        github_branch_file   — raw file from a branch HEAD
        github_tags          — repos/{repo}/tags, pick highest SemVer
        container_image      — container registry tags, pick highest SemVer
                             (supports docker.io, ghcr.io, quay.io)
        npm                  — registry.npmjs.org/{pkg}/latest
        pypi                 — pypi.org/pypi/{pkg}/json
        generic_url          — fetch URL, apply version_regex
      Optional when `upstream_watcher.source` is set in the repo config.
    required: false
    default: ''
  upstream_repo:
    description: >-
      `owner/name` of the upstream GitHub repo. Required for
      `github_release`, `github_branch_file`, and `github_tags`.
    required: false
    default: ''
  upstream_branch:
    description: >-
      Branch name. Required for `github_branch_file`; ignored for
      `github_tags` (tags are repo-wide).
    required: false
    default: ''
  version_file_path:
    description: >-
      Repo-relative path inside `upstream_branch` whose raw contents are
      the version string. Used only for `github_branch_file`. Pair with
      `version_regex` to extract the version from a structured file (for
      example a Debian `debian/changelog`). Defaults to `version` through
      the bundled Marketplace config.
    required: false
    default: ''
  image_ref:
    description: >-
      Container image reference. Used only for `container_image`.
      Supported registries:
        * `docker.io/<namespace>/<image>` (or bare `<namespace>/<image>`,
          or bare `<image>` for official `library/*` images)
        * `ghcr.io/<owner>/<image>` — public images only in this revision
        * `quay.io/<namespace>/<image>` — public repos only in this revision
      Other registries (gcr.io, mcr.microsoft.com, ECR, ACR) are rejected
      with an explicit error; PRs adding them are welcome.
    required: false
    default: ''
  package_name:
    description: >-
      Package name. Required for `npm` and `pypi`. npm scoped names
      (`@scope/name`) are supported.
    required: false
    default: ''
  version_url:
    description: 'URL to fetch. Required for `generic_url`.'
    required: false
    default: ''
  version_regex:
    description: >-
      Python regex applied to the fetched body. The first capture group
      is the version. Required for `generic_url`; optional for
      `github_branch_file` (when unset, the trimmed file body is the
      version). Short SemVer (`X`, `X.Y`) is padded to `X.Y.Z`.
    required: false
    default: ''
  tag_pattern:
    description: >-
      Optional Python regex used to filter candidate tags/versions for
      `github_tags`, `container_image`, and `github_release` (when
      `include_prereleases: true`) before SemVer ranking. Default
      `^v?\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$`.
    required: false
    default: ''
  include_prereleases:
    description: >-
      For `source: github_release` only. When `'true'`, the action lists
      `repos/{repo}/releases` (which includes pre-releases) instead of
      `releases/latest`, filters by `tag_pattern`, and picks the highest
      SemVer. Required for upstreams that ship only pre-releases (e.g.
      `actions/runner`, betas, nightlies). Defaults to `'false'` through
      the bundled Marketplace config. Ignored for all other providers.
    required: false
    default: ''
  strip_v_prefix:
    description: >-
      Strip a leading `v` from the resolved version. Defaults to `'true'`
      through the bundled Marketplace config.
    required: false
    default: ''
  tracker_path:
    description: >-
      Repo-relative path to the tracker JSON file. Created on first run;
      rewritten when the upstream version changes. Empty inherits the
      configured value (`.github/upstream/tracked-release.json` by
      default); pass `none` to disable the file, in which case the action
      always reports `changed=true`.
    required: false
    default: ''
  config_path:
    description: >-
      Path to the repo config file. Empty auto-discovers
      `.github/bos-universal-config.json` (preferred),
      `bos-universal-config.json`, `upstream-watcher.json`, or
      `.upstream-watcher.json`. Watcher settings live under an
      `upstream_watcher` section.
    required: false
    default: ''
  config_json:
    description: >-
      Inline JSON object merged after the repo config. Useful for one-off
      runs without editing a config file.
    required: false
    default: ''
  use_global_config:
    description: >-
      `auto` loads the organization/hub global config when present;
      `true` requires it; `false` disables the tier.
    required: false
    default: 'auto'
  global_config_path:
    description: >-
      Organization/hub config path, merged before the repo config.
    required: false
    default: '.github/blackout-secure-upstream-watcher-global-config.json'
  global_config_json:
    description: >-
      Inline JSON object merged into the global tier before the repo
      config is applied.
    required: false
    default: ''
  enable_ai:
    description: >-
      Kill switch for every AI feature. Empty defers to
      `upstream_watcher.ai` in the config, which enables the advisory
      release digest and error remediation by default. AI never changes
      an output value, a finding, or the exit code.
    required: false
    default: ''
  ai_provider:
    description: >-
      AI provider override: `auto` (GitHub Models when a token is
      available), `none` to disable, or a named provider configured via
      `<NAME>_API_KEY` / `<NAME>_API_ENDPOINT` env vars.
    required: false
    default: ''
  enable_job_summary:
    description: >-
      Empty defers to `organization.reporting.enable_job_summary`.
      `false` suppresses the run report in `$GITHUB_STEP_SUMMARY`.
    required: false
    default: ''
  github_token:
    description: >-
      Token used for authenticated GitHub REST calls. Falls back to
      `github.token`. Anonymous calls are rate-limited to 60/hr.
    required: false
    default: ${{ github.token }}
  user_agent:
    description: >-
      Custom `User-Agent` header sent on outbound HTTP requests.
      Defaults to `bos-upstream-watcher/<version>`.
    required: false
    default: ''

outputs:
  changed:
    description: '`true` when the upstream version differs from the tracker file.'
    value: ${{ steps.discover.outputs.changed }}
  version:
    description: 'Resolved upstream version (with `v` stripped when `strip_v_prefix` is true).'
    value: ${{ steps.discover.outputs.version }}
  tag:
    description: 'Raw upstream tag name (preserves any leading `v`).'
    value: ${{ steps.discover.outputs.tag }}
  commit:
    description: >-
      Upstream commit SHA. Empty for sources that do not map to a commit
      (`npm`, `pypi`, `container_image`, `generic_url`).
    value: ${{ steps.discover.outputs.commit }}
  source_url:
    description: 'URL that was consulted, for traceability.'
    value: ${{ steps.discover.outputs.source_url }}
  tracker_path:
    description: 'Repo-relative path of the tracker file (echoes the input).'
    value: ${{ steps.discover.outputs.tracker_path }}
  label:
    description: >-
      Canonical identifier for the upstream: `owner/name` for GitHub
      sources, the package name for `npm`/`pypi`, the canonical
      `<registry>/<ns>/<image>` for `container_image`, or the URL for
      `generic_url`. Use in commit messages / Slack notifications instead
      of an `inputs.* || inputs.*` fallback chain.
    value: ${{ steps.discover.outputs.label }}
  release_url:
    description: >-
      HTML URL of the GitHub Release. Populated for `source:
      github_release` only; empty for other providers.
    value: ${{ steps.discover.outputs.release_url }}
  release_name:
    description: >-
      Display name of the GitHub Release (may differ from the tag).
      Populated for `source: github_release` only.
    value: ${{ steps.discover.outputs.release_name }}
  release_body:
    description: >-
      Markdown release notes from GitHub Releases. Multi-line value
      (emitted via heredoc to GITHUB_OUTPUT). Populated for `source:
      github_release` only.
    value: ${{ steps.discover.outputs.release_body }}
  published_at:
    description: >-
      ISO 8601 publication timestamp of the GitHub Release (e.g.
      `2024-09-12T18:23:00Z`). Populated for `source: github_release` only.
    value: ${{ steps.discover.outputs.published_at }}
  previous_version:
    description: >-
      Version recorded in the tracker file before this run. Empty on the
      first run or when the tracker is disabled.
    value: ${{ steps.discover.outputs.previous_version }}
  update_type:
    description: >-
      SemVer distance between `previous_version` and `version`: `major`,
      `minor`, `patch`, `prerelease`, `none`, or `unknown`.
    value: ${{ steps.discover.outputs.update_type }}
  ai_summary:
    description: >-
      Advisory digest of the upstream release. AI-generated when a
      provider is available, otherwise a deterministic one-line summary.
      Multi-line value (emitted via heredoc).
    value: ${{ steps.discover.outputs.ai_summary }}
  ai_impact:
    description: >-
      Advisory upgrade impact: `low`, `medium`, `high`, or `unknown`.
      Falls back to a SemVer + breaking-change-keyword heuristic when no
      AI provider is available. Advisory only — never gates the run.
    value: ${{ steps.discover.outputs.ai_impact }}
  ai_status:
    description: >-
      Why AI was or was not used on this run (used, disabled, skipped, or
      unavailable).
    value: ${{ steps.discover.outputs.ai_status }}
  metadata:
    description: >-
      Compact JSON identity of the action that produced these outputs
      (name, version, license, repository, support links). Owned by the
      action; config can never override it.
    value: ${{ steps.discover.outputs.metadata }}

runs:
  using: composite
  steps:
    - id: discover
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
        VERSION_FILE_PATH: ${{ inputs.version_file_path }}
        IMAGE_REF: ${{ inputs.image_ref }}
        PACKAGE_NAME: ${{ inputs.package_name }}
        VERSION_URL: ${{ inputs.version_url }}
        VERSION_REGEX: ${{ inputs.version_regex }}
        TAG_PATTERN: ${{ inputs.tag_pattern }}
        STRIP_V_PREFIX: ${{ inputs.strip_v_prefix }}
        TRACKER_PATH: ${{ inputs.tracker_path }}
        INCLUDE_PRERELEASES: ${{ inputs.include_prereleases }}
        CONFIG_PATH: ${{ inputs.config_path }}
        CONFIG_JSON: ${{ inputs.config_json }}
        USE_GLOBAL_CONFIG: ${{ inputs.use_global_config }}
        GLOBAL_CONFIG_PATH: ${{ inputs.global_config_path }}
        GLOBAL_CONFIG_JSON: ${{ inputs.global_config_json }}
        ENABLE_AI: ${{ inputs.enable_ai }}
        AI_PROVIDER: ${{ inputs.ai_provider }}
        ENABLE_JOB_SUMMARY: ${{ inputs.enable_job_summary }}
        GH_TOKEN: ${{ inputs.github_token }}
        USER_AGENT_OVERRIDE: ${{ inputs.user_agent }}
      run: |
        set -euo pipefail

        # Values may also come from the config cascade, so only reject
        # explicitly supplied inputs here; the resolver validates the
        # merged result and renders a report for anything it rejects.
        case "${SOURCE}" in
          ''|github_release|github_branch_file|github_tags|container_image|npm|pypi|generic_url) ;;
          *) echo "ERROR: input 'source' is not a recognized provider (got '${SOURCE}')" >&2; exit 1 ;;
        esac

        case "${STRIP_V_PREFIX}" in
          ''|true|false) ;;
          *) echo "ERROR: input 'strip_v_prefix' must be 'true' or 'false' (got '${STRIP_V_PREFIX}')" >&2; exit 1 ;;
        esac

        case "${INCLUDE_PRERELEASES}" in
          ''|true|false) ;;
          *) echo "ERROR: input 'include_prereleases' must be 'true' or 'false' (got '${INCLUDE_PRERELEASES}')" >&2; exit 1 ;;
        esac

        case "${TRACKER_PATH}" in
          ''|none|off|false|disabled) ;;
          /*|*..*) echo "ERROR: input 'tracker_path' must be a repo-relative path: '${TRACKER_PATH}'" >&2; exit 1 ;;
        esac

        python3 "${GITHUB_ACTION_PATH}/src/discover.py"
